name: Build

on:
  push:
    branches:
      - main
  pull_request:
  # The merge queue builds with gcc and clang alone, which is where a
  # change landing first most often breaks another. The pull request and
  # the push to main run every job.
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

# A newer push to a pull request supersedes its run. Any other run is
# keyed on its ref and commit, so a merge never cancels another's run.
concurrency:
  group: |
    ${{ github.workflow }}
    ${{ github.event_name }}
    ${{ github.event.pull_request.number || format('{0}@{1}', github.ref, github.sha) }}
  cancel-in-progress: true

jobs:
  compiler:
    name: ${{ matrix.cc }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        cc:
          - gcc
          - clang

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Each compiler at the default flags, then the unit tests. The
      # sanitized builds leave out _FORTIFY_SOURCE=3 and the frame size
      # limit, and the package and per-commit builds run no unit tests.
      # The BPF objects need the BTF of a signed-BPF capable bpf-next
      # kernel, so the build runs in the same LVH VM as the package build.
      - name: Build with ${{ matrix.cc }} and run the unit tests in LVH VM
        uses: ./.github/actions/lvh
        with:
          test-name: shirudo-build-${{ matrix.cc }}
          image: kind
          image-version: bpf-next-20260603.072225
          kernel-version: bpf-next-main
          host-mount: ${{ github.workspace }}
          images-folder-parent: ${{ runner.temp }}/lvh
          install-dependencies: true
          cmd: |
            systemctl start host.mount
            cd /host
            .github/scripts/vm-toolchain.sh
            . build/vm-toolchain.env
            make -j4 CC=${{ matrix.cc }}
            make CC=${{ matrix.cc }} shirudo-build
            make CC=${{ matrix.cc }} quote-check
            make -C testing CC=${{ matrix.cc }} test-helpers
            make -C testing CC=${{ matrix.cc }} unit
            sh .github/scripts/check-operator-linkage.sh shirudo \
              tools/shirudo-build/shirudo-build
            sh .github/scripts/check-static-target.sh \
              tools/quote-check/shirudo-quote-check

  # Skipped in the merge queue, and scan-build with it.
  btf:
    name: bpf-next BTF
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # The job needs the action alone.
      - name: Check out the LVH action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions
          persist-credentials: false

      # The BTF of the bpf-next kernel the other builds run on, for the
      # builds that cannot boot it themselves.
      - name: Copy the kernel BTF out of the LVH VM
        uses: ./.github/actions/lvh
        with:
          test-name: shirudo-btf
          image: kind
          image-version: bpf-next-20260603.072225
          kernel-version: bpf-next-main
          host-mount: ${{ github.workspace }}
          images-folder-parent: ${{ runner.temp }}/lvh
          install-dependencies: true
          cpu: 2
          mem: 4G
          cmd: |
            grep -aq 'signature_size' /sys/kernel/btf/vmlinux || {
              echo 'kernel BTF lacks bpf_attr.signature_size; needs a signed-BPF capable bpf-next kernel' >&2
              exit 1
            }
            systemctl start host.mount
            mkdir -p /host/build
            cp /sys/kernel/btf/vmlinux /host/build/vmlinux.btf

      - name: Upload the kernel BTF
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bpf-next-btf
          path: build/vmlinux.btf
          if-no-files-found: error
          retention-days: 1

  # clang's static analyzer follows the paths through each function and
  # reports what a compiler warning does not: a NULL or uninitialized
  # value used, memory leaked or used after its free, a store never read.
  scan-build:
    name: scan-build
    needs: btf
    runs-on: ubuntu-latest
    container: debian:testing
    timeout-minutes: 60

    steps:
      # Without git the checkout is no repository, and the build takes its
      # version from one.
      - name: Install git
        run: apt-get update && apt-get install -y --no-install-recommends ca-certificates git

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the kernel BTF
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bpf-next-btf
          path: build

      - name: Build under clang's static analyzer
        run: sh .github/scripts/scan-build.sh build/vmlinux.btf

      - name: Upload the analyzer's report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scan-build-report
          path: build/scan-build
          if-no-files-found: ignore

  # A matrix job skipped as a whole reports one check, under none of its
  # entries' names, and the merge queue waits for the arm64 one. In the
  # queue the job runs instead, without the BTF and with every step
  # skipped.
  arch:
    name: ${{ matrix.arch }}
    needs: btf
    if: ${{ !cancelled() && (needs.btf.result == 'success' || github.event_name == 'merge_group') }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 90

    # Every other job builds and tests on x86-64. arm64 builds natively on
    # an arm64 runner; riscv64, which has none, under QEMU user emulation
    # and, taking the longest, on a push to main alone. An include would
    # add back the entry the exclude takes out.
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, riscv64]
        exclude:
          - arch: ${{ github.event_name != 'push' && 'riscv64' || '' }}

    steps:
      - name: Check out repository
        if: github.event_name != 'merge_group'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the kernel BTF
        if: github.event_name != 'merge_group'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bpf-next-btf
          path: build

      - name: Set up QEMU user emulation
        if: github.event_name != 'merge_group' && matrix.arch == 'riscv64'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: riscv64

      - name: Build and run the unit tests on Debian testing
        if: github.event_name != 'merge_group'
        env:
          ARCH: ${{ matrix.arch }}
        run: >-
          docker run --rm --platform "linux/$ARCH"
          -v "$PWD:/src" -w /src debian:testing
          sh .github/scripts/build-debian.sh build/vmlinux.btf
